<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>probability — Screenshot Framer</title>
<style>
  :root { --accent:#8b5cf6; --accent2:#6366f1; --bg:#0f1117; --panel:#171a22; --border:#272b36; --text:#e7e9ee; --dim:#9aa0ad; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif; background:var(--bg); color:var(--text); }
  .wrap { display:flex; gap:24px; padding:24px; align-items:flex-start; flex-wrap:wrap; }
  .controls { width:300px; flex:0 0 auto; background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:18px; position:sticky; top:24px; }
  .controls h1 { font-size:16px; margin:0 0 4px; }
  .controls p { font-size:12px; color:var(--dim); margin:0 0 16px; line-height:1.5; }
  label { display:block; font-size:12px; font-weight:600; margin:14px 0 6px; }
  input[type=text], textarea, select {
    width:100%; font:inherit; font-size:13px; color:var(--text); background:#1e222c;
    border:1px solid var(--border); border-radius:8px; padding:8px 10px;
  }
  textarea { resize:vertical; min-height:54px; }
  input[type=file] { width:100%; font-size:12px; color:var(--dim); }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
  button { font:inherit; font-weight:600; font-size:13px; cursor:pointer; border:none; border-radius:9px; padding:10px 14px; color:#fff; background:linear-gradient(135deg,var(--accent2),var(--accent)); width:100%; margin-top:18px; }
  button:hover { filter:brightness(1.08); }
  .preview { flex:1; min-width:480px; }
  .preview canvas { width:100%; height:auto; border-radius:12px; border:1px solid var(--border); display:block; }
  .hint { font-size:11px; color:var(--dim); margin-top:10px; line-height:1.6; }
  .swatches { display:flex; gap:8px; margin-top:6px; }
  .swatch { width:28px; height:28px; border-radius:7px; cursor:pointer; border:2px solid transparent; }
  .swatch.sel { border-color:#fff; }
</style>
</head>
<body>
<div class="wrap">
  <div class="controls">
    <h1>Screenshot Framer</h1>
    <p>縦長のポップアップ画像を、ストア規定の <b>1280×800 / 640×400</b> に合成して書き出します。</p>

    <label>① スクショ画像（PNG/JPG）</label>
    <input type="file" id="file" accept="image/*" />

    <label>② レイアウト</label>
    <select id="layout">
      <option value="split">左テキスト + 右パネル</option>
      <option value="center">中央配置</option>
    </select>

    <label>③ 見出し</label>
    <input type="text" id="headline" value="Is that page written by a human?" />

    <label>④ サブテキスト</label>
    <textarea id="sub">AI generation score for text, images & video — fully on-device.</textarea>

    <label>⑤ 背景アクセント</label>
    <div class="swatches" id="swatches"></div>

    <label>⑥ 出力サイズ</label>
    <div class="row">
      <select id="size">
        <option value="1280x800">1280 × 800</option>
        <option value="640x400">640 × 400</option>
      </select>
    </div>

    <button id="download">PNG をダウンロード</button>
    <div class="hint">
      ・ポップアップ幅は約340pxなので「左テキスト+右パネル」がきれいに収まります。<br>
      ・設定画面（横長）のスクショは「中央配置」が向いています。<br>
      ・複数枚（テキスト判定／メディア／設定）作ると効果的です。
    </div>
  </div>

  <div class="preview">
    <canvas id="canvas" width="1280" height="800"></canvas>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let shot = null;
let accent = ['#6366f1','#8b5cf6'];

const PRESETS = [
  ['#6366f1','#8b5cf6'], // indigo→violet (brand)
  ['#0ea5e9','#6366f1'], // sky→indigo
  ['#8b5cf6','#ec4899'], // violet→pink
  ['#10b981','#0ea5e9'], // emerald→sky
  ['#f59e0b','#ef4444'], // amber→red
];

const sw = document.getElementById('swatches');
PRESETS.forEach((p, i) => {
  const d = document.createElement('div');
  d.className = 'swatch' + (i===1?' sel':'');
  d.style.background = `linear-gradient(135deg, ${p[0]}, ${p[1]})`;
  d.onclick = () => { accent = p; [...sw.children].forEach(c=>c.classList.remove('sel')); d.classList.add('sel'); render(); };
  sw.appendChild(d);
});
accent = PRESETS[1];

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x+r, y);
  c.arcTo(x+w, y, x+w, y+h, r);
  c.arcTo(x+w, y+h, x, y+h, r);
  c.arcTo(x, y+h, x, y, r);
  c.arcTo(x, y, x+w, y, r);
  c.closePath();
}

function wrapText(c, text, x, y, maxW, lh) {
  const words = text.split(/\s+/);
  let line = '', yy = y;
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (c.measureText(test).width > maxW && line) { c.fillText(line, x, yy); line = w; yy += lh; }
    else line = test;
  }
  if (line) c.fillText(line, x, yy);
  return yy;
}

function drawBrand(c, x, y, scale=1) {
  // ロゴ(角丸+ガウス曲線) + ワードマーク
  const s = 30*scale;
  const g = c.createLinearGradient(x, y, x+s, y+s);
  g.addColorStop(0, accent[0]); g.addColorStop(1, accent[1]);
  c.fillStyle = g; roundRect(c, x, y, s, s, 9*scale); c.fill();
  c.strokeStyle = '#fff'; c.lineWidth = 2.4*scale; c.lineCap='round';
  c.beginPath();
  const pad = s*0.16;
  c.moveTo(x+pad, y+s-pad);
  c.bezierCurveTo(x+s*0.32, y+s-pad, x+s*0.30, y+pad, x+s*0.5, y+pad);
  c.bezierCurveTo(x+s*0.70, y+pad, x+s*0.68, y+s-pad, x+s-pad, y+s-pad);
  c.stroke();
  c.fillStyle = '#fff'; c.font = `700 ${22*scale}px -apple-system,"Hiragino Sans",sans-serif`;
  c.textBaseline = 'middle';
  c.fillText('probability', x + s + 12*scale, y + s/2);
  c.textBaseline = 'alphabetic';
}

function drawShot(c, box) {
  if (!shot) {
    // プレースホルダ
    c.fillStyle = 'rgba(255,255,255,0.06)';
    roundRect(c, box.x, box.y, box.w, box.h, 16); c.fill();
    c.fillStyle = 'rgba(255,255,255,0.4)'; c.font = '600 18px sans-serif'; c.textAlign='center';
    c.fillText('スクショ画像を選択', box.x+box.w/2, box.y+box.h/2);
    c.textAlign='left';
    return;
  }
  // アスペクト維持で box にフィット
  const ar = shot.width / shot.height;
  let w = box.w, h = w / ar;
  if (h > box.h) { h = box.h; w = h * ar; }
  const x = box.x + (box.w - w)/2;
  const y = box.y + (box.h - h)/2;
  // 影
  c.save();
  c.shadowColor = 'rgba(0,0,0,0.5)'; c.shadowBlur = 40; c.shadowOffsetY = 18;
  c.fillStyle = '#000'; roundRect(c, x, y, w, h, 16); c.fill();
  c.restore();
  // 画像をクリップして描画
  c.save();
  roundRect(c, x, y, w, h, 16); c.clip();
  c.drawImage(shot, x, y, w, h);
  c.restore();
  // 枠線
  c.strokeStyle = 'rgba(255,255,255,0.12)'; c.lineWidth = 1.5;
  roundRect(c, x, y, w, h, 16); c.stroke();
}

function render() {
  const [W, H] = document.getElementById('size').value.split('x').map(Number);
  canvas.width = W; canvas.height = H;
  const layout = document.getElementById('layout').value;
  const headline = document.getElementById('headline').value;
  const sub = document.getElementById('sub').value;
  const k = W/1280; // スケール係数

  // 背景グラデーション
  const bg = ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#11131b'); bg.addColorStop(1,'#0c0e14');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
  // アクセントグロー
  const glow = ctx.createRadialGradient(W*0.85, H*0.1, 0, W*0.85, H*0.1, W*0.6);
  glow.addColorStop(0, accent[1]+'55'); glow.addColorStop(1, 'transparent');
  ctx.fillStyle = glow; ctx.fillRect(0,0,W,H);
  const glow2 = ctx.createRadialGradient(W*0.05, H*0.95, 0, W*0.05, H*0.95, W*0.5);
  glow2.addColorStop(0, accent[0]+'33'); glow2.addColorStop(1, 'transparent');
  ctx.fillStyle = glow2; ctx.fillRect(0,0,W,H);

  drawBrand(ctx, 48*k, 44*k, k);

  if (layout === 'split') {
    // 左テキスト
    const tx = 64*k, tw = W*0.42;
    ctx.fillStyle = '#fff'; ctx.textBaseline='alphabetic';
    ctx.font = `700 ${52*k}px -apple-system,"Hiragino Sans",sans-serif`;
    let y = H*0.40;
    y = wrapText(ctx, headline, tx, y, tw, 60*k);
    ctx.fillStyle = '#aeb4c0'; ctx.font = `400 ${22*k}px -apple-system,"Hiragino Sans",sans-serif`;
    wrapText(ctx, sub, tx, y + 36*k, tw, 32*k);
    // 右パネル
    drawShot(ctx, { x: W*0.56, y: H*0.10, w: W*0.40, h: H*0.82 });
  } else {
    ctx.fillStyle = '#fff'; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    ctx.font = `700 ${46*k}px -apple-system,"Hiragino Sans",sans-serif`;
    let y = H*0.16;
    y = wrapText(ctx, headline, W/2, y, W*0.8, 54*k);
    ctx.fillStyle = '#aeb4c0'; ctx.font = `400 ${20*k}px sans-serif`;
    y = wrapText(ctx, sub, W/2, y + 30*k, W*0.7, 28*k);
    ctx.textAlign='left';
    drawShot(ctx, { x: W*0.18, y: y + 24*k, w: W*0.64, h: H - (y+24*k) - 40*k });
  }
}

document.getElementById('file').addEventListener('change', (e) => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => { shot = img; render(); };
  img.src = URL.createObjectURL(f);
});
['headline','sub','layout','size'].forEach(id =>
  document.getElementById(id).addEventListener('input', render));

document.getElementById('download').addEventListener('click', () => {
  render();
  canvas.toBlob((blob) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `probability-screenshot-${canvas.width}x${canvas.height}.png`;
    a.click();
  }, 'image/png');
});

render();
</script>
</body>
</html>
